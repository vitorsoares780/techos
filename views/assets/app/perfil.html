<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — TechOS</title>
  <meta name="description" content="Painel da assistência técnica no TechOS.">
  <link rel="icon" href="../_common/images/logo.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="../_common/styles/base.css">
  <link rel="stylesheet" href="../_common/styles/toast.css">
  <link rel="stylesheet" href="styles/app.css">
</head>

<body class="app">
  <header class="app-topbar">
    <section style="display:flex;align-items:center;gap:0.75rem">
      <button class="sidebar-toggle" type="button" aria-label="Abrir menu lateral" data-sidebar-toggle>
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="dashboard.html">
        <img src="../_common/images/logo.png" class="logo">
        TechOS
      </a>
    </section>

    <section class="app-topbar-actions">
      <a class="user-chip" href="perfil.html" aria-label="Conta" data-user-chip>
       <span class="avatar" aria-hidden="true" data-user-avatar>U</span>
       <span data-user-name>Usuário</span>
      </a>
    </section>
  </header>
  <section class="app-shell">
    <aside class="app-sidebar" data-sidebar>
      <section class="sidebar-section">
        <h4>Operação</h4>
        <ul>
          <li><a class="sidebar-link" href="dashboard.html"><span class="ico" aria-hidden="true">📊</span>Visão
              geral</a></li>
          <li><a class="sidebar-link" href="ordens.html"><span class="ico" aria-hidden="true">🧾</span>Ordens de
              serviço</a></li>
          <li><a class="sidebar-link" href="ordem-nova.html"><span class="ico" aria-hidden="true">➕</span>Nova OS</a>
          </li>
        </ul>
      </section>
      <section class="sidebar-section">
        <h4>Conta</h4>
        <ul>
          <li><a class="sidebar-link" aria-current="page" href="perfil.html"><span class="ico"
                aria-hidden="true">👤</span>Perfil e Configurações</a></li>
          <li><a class="sidebar-link" href="../../public/login.html" data-logout><span class="ico" aria-hidden="true">🚪</span>Sair</a>
          </li>
        </ul>
      </section>
    </aside>
    <main class="app-main">
      <section class="page-head">
        <section>
          <h1>Perfil e Configurações</h1>
          <p>Gerencie seus dados pessoais e senha.</p>
        </section>
      </section>

      <section class="detail-grid">
        <form class="panel" data-perfil-form novalidate>
          <header class="panel-head">
            <h2>Dados pessoais</h2>
          </header>
          <section class="form-grid">
            <section class="form-field"><label for="p-nome">Nome completo</label><input id="p-nome" name="nome" required></section>
            <section class="form-field"><label for="p-email">E-mail</label><input id="p-email" name="email" type="email" required></section>
            <section class="form-field full">
              <label for="p-foto">Foto do perfil</label>
              <section class="profile-photo-control">
                <span class="avatar profile-photo-initial" data-profile-photo-initial aria-hidden="true">U</span>
                <img class="profile-photo-preview" data-profile-photo-preview alt="Prévia da foto do perfil" hidden>
                <input id="p-foto" name="photo" type="file" accept="image/*" data-profile-photo>
              </section>
            </section>
          </section>
          <section class="form-actions"><button class="btn btn-primary" type="submit">Salvar alterações</button>
          </section>
        </form>

        <form class="panel" data-senha-form novalidate>
          <header class="panel-head">
            <h2>Alterar senha</h2>
          </header>
          <section style="display:flex;flex-direction:column;gap:1rem">
            <section class="form-field"><label for="p-nova">Nova senha</label><input id="p-nova" name="nova"
              type="password" minlength="8" autocomplete="new-password" data-senha-nova required></section>
            <section class="form-field"><label for="p-conf">Confirmar nova senha</label><input id="p-conf"
              name="confirmar" type="password" minlength="8" autocomplete="new-password" data-senha-confirma required></section>
          </section>
          <section class="form-actions"><button class="btn btn-primary" type="submit">Atualizar senha</button></section>
        </form>

      </section>
    </main>
  </section>
  <script src="scripts/app.js"></script>
  <script src="scripts/user-chip.js"></script>
  <script type="module" src="scripts/perfil.js"></script>
  <script src="scripts/logout.js"></script>
</body>

</html>
